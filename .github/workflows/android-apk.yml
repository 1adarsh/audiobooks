name: Build cross-platform release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: storybook-audio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEYSTORE_PASSWORD" >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEY_ALIAS" >&2
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/storybook-audio-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: npm run build:android:debug-apk --workspace @storybook-audio/mobile

      - name: Build signed release APK
        run: npm run android:apk

      - name: Prepare Android release assets
        run: |
          mkdir -p release-assets
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release-assets/storybook-audio.apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk release-assets/storybook-audio-android-release.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: release-assets/*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          workspace="$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "Expo did not generate an iOS workspace." >&2
            exit 1
          fi
          scheme="$(xcodebuild -list -json -workspace "$workspace" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const result = JSON.parse(input); const schemes = result.workspace?.schemes ?? result.project?.schemes ?? []; if (!schemes.length) process.exit(1); process.stdout.write(schemes[0]); });')"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/storybook-audio-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/storybook-audio-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Xcode did not produce an iOS Simulator app bundle." >&2
            exit 1
          fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app_path" release-assets/storybook-audio-ios-simulator.zip

      - name: Upload iOS Simulator release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-ios
          path: release-assets/storybook-audio-ios-simulator.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Export web app
        run: npm run mobile:web:export

      - name: Package web app
        run: |
          mkdir -p release-assets
          cd apps/mobile/dist
          zip -qr ../../../release-assets/storybook-audio-web.zip .

      - name: Upload web app to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - name: Upload web release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-web
          path: release-assets/storybook-audio-web.zip
          if-no-files-found: error

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: [android, ios-simulator, web, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
