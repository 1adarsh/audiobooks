name: Build cross-platform release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: storybook-audio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure all four Android signing secrets before creating a release tag."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/storybook-audio-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build production APK
        run: npm run android:apk

      - name: Validate production APK
        run: |
          set -euo pipefail
          apk_path="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$apksigner_path" ]; then
            echo "Android SDK build-tools did not provide apksigner." >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose "$apk_path"
          unzip -Z1 "$apk_path" | grep -qx 'assets/index.android.bundle'

      - name: Prepare Android release assets
        run: |
          mkdir -p release-assets
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk release-assets/storybook-audio.apk

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-android
          path: release-assets/*
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          workspace="$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "Expo did not generate an iOS workspace." >&2
            exit 1
          fi
          project_scheme="$(basename "$workspace" .xcworkspace)"
          available_schemes="$(xcodebuild -list -json -workspace "$workspace")"
          scheme="$(APP_SCHEME="$project_scheme" node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const result = JSON.parse(input); const schemes = result.workspace?.schemes ?? result.project?.schemes ?? []; const appScheme = schemes.find(candidate => candidate === process.env.APP_SCHEME); if (!appScheme) { console.error(`App scheme "${process.env.APP_SCHEME}" not found. Available schemes: ${schemes.join(", ")}`); process.exit(1); } process.stdout.write(appScheme); });' <<< "$available_schemes")"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/storybook-audio-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/storybook-audio-ios/Build/Products/Release-iphonesimulator" -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Xcode did not produce an iOS Simulator app bundle." >&2
            exit 1
          fi
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app_path" release-assets/storybook-audio-ios-simulator.zip

      - name: Upload iOS Simulator release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-ios
          path: release-assets/storybook-audio-ios-simulator.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Export web app
        run: npm run mobile:web:export

      - name: Package web app
        run: |
          mkdir -p release-assets
          cd apps/mobile/dist
          zip -qr ../../../release-assets/storybook-audio-web.zip .

      - name: Upload web app to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist

      - name: Upload web release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-web
          path: release-assets/storybook-audio-web.zip
          if-no-files-found: error

  deploy-pages:
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: web
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    needs: [android, ios-simulator, web]
    if: always() && needs.android.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Download platform release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
