[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storybook-audio-api"
version = "0.1.0"
description = "API for chapter-based storybook audio generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ai = [
  "huggingface-hub>=0.27,<2.0",
  "numpy>=1.26",
  "onnxruntime>=1.20,<2.0",
  "spacy>=3.8,<4.0",
  "tokenizers>=0.21,<1.0",
]
ocr = [
  "pdf2image>=1.17,<2.0",
  "pytesseract>=0.3.13,<1.0",
]
neural-voice = [
  "huggingface-hub>=0.27,<2.0",
  "piper-tts>=1.8,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
